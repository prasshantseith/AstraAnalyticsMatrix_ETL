name: MF Ingestion Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Supabase environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: prod
  schedule:
    - cron: "0 20 * * *"    # Daily (all days) against dev
    - cron: "0 18 * * 1-5"  # Weekdays 6 PM UTC - prod only
    - cron: "0 19 * * 1-5"  # Weekdays 7 PM UTC - prod only
    - cron: "0 20 * * 1-5"  # Weekdays 8 PM UTC - prod only
    - cron: "0 21 * * 1-5"  # Weekdays 9 PM UTC - prod only
    - cron: "0 0 * * 1-5"   # Weekdays 12 AM UTC - prod only
    - cron: "0 2 * * 1-5"   # Weekdays 2 AM UTC - prod only

jobs:
  ingest-dev:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MF ingestion (dev)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python src/ingestion/mf_ingest.py --environment dev

  ingest-prod:
    if: (github.event_name == 'schedule' && github.event.schedule != '0 20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MF ingestion (prod)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python src/ingestion/mf_ingest.py --environment prod
