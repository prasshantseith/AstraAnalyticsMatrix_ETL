name: NSE Index Daily Snapshot Backfill (API Trigger)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Supabase environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: prod
      start_date:
        description: 'Backfill start date YYYY-MM-DD (optional; defaults to 2014-05-02)'
        required: false
        type: string
      end_date:
        description: 'Backfill end date YYYY-MM-DD (optional; defaults to yesterday)'
        required: false
        type: string
      sleep_seconds:
        description: 'Delay between niftyindices.com requests (optional; defaults to 0.5)'
        required: false
        type: string

jobs:
  backfill-dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run NSE index daily snapshot backfill (dev)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BACKFILL_START_DATE: ${{ inputs.start_date }}
          BACKFILL_END_DATE: ${{ inputs.end_date }}
          BACKFILL_SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: |
          ARGS=(--environment dev)
          if [ -n "$BACKFILL_START_DATE" ]; then ARGS+=(--start-date "$BACKFILL_START_DATE"); fi
          if [ -n "$BACKFILL_END_DATE" ]; then ARGS+=(--end-date "$BACKFILL_END_DATE"); fi
          if [ -n "$BACKFILL_SLEEP_SECONDS" ]; then ARGS+=(--sleep-seconds "$BACKFILL_SLEEP_SECONDS"); fi
          python src/ingestion/nse_index_daily_snapshot_backfill.py "${ARGS[@]}"

  backfill-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run NSE index daily snapshot backfill (prod)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BACKFILL_START_DATE: ${{ inputs.start_date }}
          BACKFILL_END_DATE: ${{ inputs.end_date }}
          BACKFILL_SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: |
          ARGS=(--environment prod)
          if [ -n "$BACKFILL_START_DATE" ]; then ARGS+=(--start-date "$BACKFILL_START_DATE"); fi
          if [ -n "$BACKFILL_END_DATE" ]; then ARGS+=(--end-date "$BACKFILL_END_DATE"); fi
          if [ -n "$BACKFILL_SLEEP_SECONDS" ]; then ARGS+=(--sleep-seconds "$BACKFILL_SLEEP_SECONDS"); fi
          python src/ingestion/nse_index_daily_snapshot_backfill.py "${ARGS[@]}"
