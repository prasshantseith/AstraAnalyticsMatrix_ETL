name: Test Key Vault Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Install jq
      run: sudo apt-get install jq -y

    - name: Get Azure Access Token
      run: |
        TOKEN=$(curl -X POST \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=client_credentials&client_id=${AZURE_CLIENT_ID}&client_secret=${AZURE_CLIENT_SECRET}&resource=https://vault.azure.net" \
          https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/token | jq -r '.access_token')
        echo "AZURE_TOKEN=$TOKEN" >> $GITHUB_ENV
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Fetch TEST_SECRET from Key Vault
      run: |
        SECRET=$(curl -H "Authorization: Bearer $AZURE_TOKEN" \
          https://${{ secrets.KEYVAULT_NAME }}.vault.azure.net/secrets/TEST_SECRET?api-version=7.3 | jq -r '.value')
        echo "TEST_SECRET_VALUE=$SECRET"
